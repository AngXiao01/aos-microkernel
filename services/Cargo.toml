# User-space programs. Built for aarch64-unknown-none (hard float; the kernel saves and
# restores FP state per thread). The kernel's ktest build compiles ktest-user from here.
[workspace]
resolver = "3"
members = ["rt", "ktest-user", "root", "memory", "virtio", "blk", "hostlink", "storage", "net", "netstack", "egress", "view"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = true
