[package]
name = "aos-netstack"
description = "smoltcp netstack: outbound endpoint for egress, inbound endpoint for view (SPEC §B5)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "netstack"
path = "src/main.rs"
test = false
bench = false

[dependencies]
aos-rt = { path = "../rt" }
linked_list_allocator = { version = "0.10.5", default-features = false, features = ["use_spin"] }
smoltcp = { version = "0.11.0", default-features = false, features = ["alloc", "proto-ipv4", "socket-tcp", "socket-udp", "medium-ethernet"] }

