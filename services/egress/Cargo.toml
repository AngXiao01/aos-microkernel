[package]
name = "aos-egress-gateway"
description = "Egress gateway: the only outbound endpoint, TLS client (SPEC §B4, §B7)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "egress"
path = "src/main.rs"
test = false
bench = false

[dependencies]
aos-rt = { path = "../rt" }
aos-egress = { path = "../../core/aos-egress" }
aos-confirm = { path = "../../core/aos-confirm" }
aos-types = { path = "../../core/aos-types" }
linked_list_allocator = { version = "0.10.5", default-features = false, features = ["use_spin"] }
embedded-tls = { version = "0.19", default-features = false, features = ["alloc"] }
embedded-io = { version = "0.7", default-features = false }
rand_core = { version = "0.6", default-features = false }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa"] }
sha2 = { version = "0.10", default-features = false }

